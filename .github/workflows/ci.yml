# Run `scripts/lint.sh` and the test suite on every push and pull request.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: shfmt, ShellCheck, Ruff and Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ShellCheck is preinstalled on the runner; shfmt is not. Use the release
      # binary: `go install` needs whatever Go toolchain shfmt requires, and the
      # runner cannot always download it. Retry, as GitHub's release downloads
      # sometimes answer with a transient 5xx.
      - name: Install shfmt
        env:
          SHFMT_VERSION: v3.14.1
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 -o "$HOME/.local/bin/shfmt" \
            "https://github.com/mvdan/sh/releases/download/$SHFMT_VERSION/shfmt_${SHFMT_VERSION}_linux_amd64"
          chmod +x "$HOME/.local/bin/shfmt"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Ruff runs through uvx and Prettier through npx, at the versions
      # `scripts/lint.sh` pins.
      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check formatting and lint
        run: ./scripts/lint.sh

  test:
    name: Tests on Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is what a fresh Mac runs the installer with, from the Command
        # Line Tools; 3.x is the latest release. actions/setup-python has no
        # 3.9 build for Ubuntu 26.04, so that one stays on 24.04.
        include:
          - python: '3.9'
            os: ubuntu-24.04
          - python: '3.x'
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # The runner has Bash but not Zsh, whose startup files the tests source.
      - name: Install Zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      # compinit refuses, without a terminal to ask on, to load completions from
      # directories other users can write to, and the runner image ships some.
      # List them, then hand them to root and drop group and other write.
      - name: Secure Zsh's completion directories
        run: |
          zsh -fc 'autoload -Uz compaudit; compaudit' | tee "$RUNNER_TEMP/insecure" || true
          if [ -s "$RUNNER_TEMP/insecure" ]; then
            xargs -d '\n' sudo chown root < "$RUNNER_TEMP/insecure"
            xargs -d '\n' sudo chmod g-w,o-w < "$RUNNER_TEMP/insecure"
          fi

      - name: Run the tests
        run: python -m unittest discover -s tests -v
