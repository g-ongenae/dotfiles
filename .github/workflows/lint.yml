# Run the same checks as `scripts/lint.sh` on every push and pull request.
name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shell:
    name: shfmt and ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ShellCheck is preinstalled on the runner; shfmt is not. Use the release
      # binary: `go install` needs whatever Go toolchain shfmt requires, and the
      # runner cannot always download it.
      - name: Install shfmt
        env:
          SHFMT_VERSION: v3.14.1
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/shfmt" \
            "https://github.com/mvdan/sh/releases/download/$SHFMT_VERSION/shfmt_${SHFMT_VERSION}_linux_amd64"
          chmod +x "$HOME/.local/bin/shfmt"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check formatting and lint shell files
        run: ./scripts/lint.sh

