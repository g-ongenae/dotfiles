# Run the same checks as `scripts/lint.sh` and `npm run lint` on every push and
# pull request, and make sure every changed userscript carries a higher @version.
name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shell:
    name: shfmt and ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ShellCheck is preinstalled on the runner; shfmt is not. Use the release
      # binary: `go install` needs whatever Go toolchain shfmt requires, and the
      # runner cannot always download it. Retry, as GitHub's release downloads
      # sometimes answer with a transient 5xx.
      - name: Install shfmt
        env:
          SHFMT_VERSION: v3.14.1
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 -o "$HOME/.local/bin/shfmt" \
            "https://github.com/mvdan/sh/releases/download/$SHFMT_VERSION/shfmt_${SHFMT_VERSION}_linux_amd64"
          chmod +x "$HOME/.local/bin/shfmt"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check formatting and lint shell files
        run: ./scripts/lint.sh


  javascript:
    name: ESLint and Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Neither tool needs an install script to run.
      - name: Install ESLint and Prettier
        run: npm ci --ignore-scripts

      - name: Check formatting and lint JavaScript files
        run: npm run lint

  userscript-versions:
    name: Userscript versions
    runs-on: ubuntu-latest
    steps:
      # The check compares against the commit this push or pull request starts
      # from, so it needs the history and not only the last commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check that changed userscripts raise their @version
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/check-userscript-versions.py "$BASE" HEAD
