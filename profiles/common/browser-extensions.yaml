# Firefox entries are AMO slugs; Chromium entries are Web Store IDs.
firefox:
  - ublock-origin
  - sponsorblock
  - privacy-badger17
  - pr-review-collector
  - github-mermaid-jsdoc-viewer
  - violentmonkey
# Unpublished Firefox extensions: GitHub repositories to load or sign by hand.
firefox-source:
  - g-ongenae/parrot
fedora-firefox:
  - switchyard
chromium:
  - jhkfjpfhioaoopiapaipleecedggpimi
  - jdkfjefccncegmcelnnbfmmibppjchgi
# macOS only: GitHub repositories whose autoconfig/install.sh is run
# against /Applications/Firefox.app (not LibreWolf or Zen).
macos-firefox-autoconfig:
  - g-ongenae/firefox-memory-guard
# Userscripts, kept in https://github.com/g-ongenae/userscripts and installed
# through Violentmonkey. The browsers step reads these sources in --apply mode
# and lists the scripts on the browser setup page, with a zip that Violentmonkey
# imports in one go.
# Greasy Fork users (the number in their profile URL): every script they publish.
greasyfork-users:
  - '1663163'
# Greasy Fork script sets, such as a user's Favorites (the number in the set's
# ?set= URL). Greasy Fork currently refuses set listings to scripts (HTTP 403),
# so a set is linked from the page instead; prefer greasyfork-scripts.
greasyfork-sets:
# Single Greasy Fork scripts (the number in their URL), such as favorites by
# other authors.
greasyfork-scripts:
# Userscripts published outside Greasy Fork: HTTPS URLs ending in .user.js.
# find-active-forks is a modified copy of Greasy Fork script 397171.
userscript-urls:
  - https://raw.githubusercontent.com/g-ongenae/userscripts/main/userscripts/github/find-active-forks.user.js
